# .github/workflows/deploy-<service>.yml — one per service. Replace SERVICE, the folder and the tests.
# Builds the image, pushes it to Artifact Registry and swaps ONLY the image of the Cloud Run service.
# Everything else of the service (env, mounted secrets, resources, network, permissions) lives in
# infra/ and is applied by hand with `terraform apply`. Terraform takes the latest TAGGED image, which
# is this one, so its next `plan` shows no changes.
name: Deploy SERVICE

on:
  push:
    branches: [main]
    paths: ["SERVICE_DIR/**", ".github/workflows/deploy-SERVICE.yml", "!SERVICE_DIR/**/*.md"]
  workflow_dispatch: {}

concurrency:
  group: deploy-SERVICE
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation (no keys)

jobs:
  test: # delete if the service has no tests; then drop `needs` below
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: echo "run the service tests here"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v4

      # GitHub sometimes delivers the same push twice. Tags are immutable, so a second build of the same
      # commit would fail: if the image already exists, skip the build (the deploy is harmless).
      - id: image
        run: |
          if gcloud artifacts docker images describe "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.APP }}/SERVICE:${{ steps.sha.outputs.short }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./SERVICE_DIR
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.APP }}/SERVICE:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=SERVICE
          cache-to: type=gha,mode=max,scope=SERVICE

      - name: Deploy (image only)
        run: |
          gcloud run services update "${{ vars.APP }}-SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" --quiet \
            --image="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.APP }}/SERVICE:${{ steps.sha.outputs.short }}"
